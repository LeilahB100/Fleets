{% extends './home.html' %}
{% load crispy_forms_tags %}

{% block content %}
    <h1>Edit - {{repairissues.id}}</h1>
    <form method="post" data-demo-submit="false">
        {% csrf_token %}
        {{form|crispy}}

        <input type="submit" class="btn btn-primary">
        <a href="{% url 'repair_issues_page' %}" class="btn btn-danger">Cancel</a>

        {% if msg %}
            <div class="alert alert-info mt-3">{{msg}}</div>
        {% endif %}
    </form>
{% endblock content %}
