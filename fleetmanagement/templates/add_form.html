{% load crispy_forms_tags %}


<div class="add-bar">
    <button type="button" class="btn btn-primary" onclick="document.getElementById('add-popup').showModal()">
        + {{ title }}
    </button>
</div>


<dialog id="add-popup" class="add-popup">
    <div class="add-popup-header">
        <h3>{{ title }}</h3>
        <button type="button" class="add-popup-x" onclick="this.closest('dialog').close()">&times;</button>
    </div>

    <form method="post" data-demo-submit="false">
        {% csrf_token %}
        {{ form|crispy }}

        <div class="add-popup-actions">
            <button type="button" class="btn btn-outline" onclick="this.closest('dialog').close()">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
        </div>
    </form>
</dialog>


{% if form.errors or request.GET.add %}
    <script>document.getElementById('add-popup').showModal();</script>
{% endif %}
